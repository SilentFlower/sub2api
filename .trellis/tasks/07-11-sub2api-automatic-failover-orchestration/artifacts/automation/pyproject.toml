[project]
name = "sub2api-ha-agent"
version = "0.1.0"
description = "Sub2API 双节点自动容灾 agent"
requires-python = ">=3.11"

[project.scripts]
sub2api-ha-agent = "sub2api_ha.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sub2api_ha*"]
